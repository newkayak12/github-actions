name: Example Slack Notifications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Build project
      run: npm run build
      
    # Notify on successful build
    - name: Notify Success
      if: success()
      uses: ./
      with:
        slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: '#builds'
        template: 'success'
        title: '✅ Build Successful'
        description: 'All tests passed and build completed successfully'
        
    # Notify on build failure
    - name: Notify Failure
      if: failure()
      uses: ./
      with:
        slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: '#alerts'
        template: 'error'
        title: '❌ Build Failed'
        description: 'Tests failed or build error occurred'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to staging
      run: echo "Deploying to staging..."
      
    # Custom block notification for deployment
    - name: Deployment Notification
      uses: ./
      with:
        slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: '#deployments'
        blocks: |
          [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "🚀 Staging Deployment"
              }
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Deployment Status:* In Progress\n*Environment:* Staging\n*Triggered by:* ${{ github.actor }}"
              },
              "accessory": {
                "type": "image",
                "image_url": "https://github.com/${{ github.actor }}.png",
                "alt_text": "${{ github.actor }}"
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Repository:*\n<https://github.com/${{ github.repository }}|${{ github.repository }}>"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Branch:*\n${{ github.ref_name }}"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
                }
              ]
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View Logs"
                  },
                  "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "style": "primary"
                },
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View Staging"
                  },
                  "url": "https://staging.example.com"
                }
              ]
            }
          ]

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production
      run: echo "Deploying to production..."
      
    # Production deployment notification
    - name: Production Release Notification
      uses: ./
      with:
        slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: '#releases'
        template: 'deployment'
        title: '🎉 Production Release'
        description: '${{ github.event.release.name }} is now live in production!'